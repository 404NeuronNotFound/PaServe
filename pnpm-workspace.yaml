packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  argon2: true
  '@prisma/engines': false
  esbuild: true
  prisma: false
# Security fixes for transitive dependencies; keep minimum patched versions explicit.
overrides:
  'body-parser@>=2.0.0 <2.4.0': '2.4.0'
  'multer@>=2.0.0 <2.5.0': '2.5.0'
  'deepmerge-ts@<8.0.0': '8.0.0'
  'mysql2@<3.23.1': '3.23.1'
  'fast-uri@>=3.0.0 <3.1.9': '3.1.9'
  'zod@>=4.0.0 <4.6.6': '4.6.6'
  'undici@>=8.0.0 <8.12.2': '8.12.2'
